<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Estilo Fluent / Windows 11 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gradiente do Escudo e Elementos Primários -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Gradiente do Raio de Performance -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo com Cantos Arredondados Fluent (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" filter="url(#dropShadow)" />

  <!-- Escudo Central de Proteção & Automação -->
  <path d="M256 96 L384 152 V264 C384 340 328 404 256 424 C184 404 128 340 128 264 V152 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="18" 
        stroke-linejoin="round" />

  <!-- Raio / Símbolo de Alta Performance & Limpeza Rápida -->
  <path d="M272 168 L192 272 H256 L240 344 L320 240 H256 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round" />

  <!-- Brilhos Decorativos Tecnológicos -->
  <circle cx="256" cy="120" r="6" fill="#38bdf8" />
  <circle cx="370" cy="240" r="5" fill="#38bdf8" opacity="0.6" />
  <circle cx="142" cy="240" r="5" fill="#38bdf8" opacity="0.6" />
</svg>

